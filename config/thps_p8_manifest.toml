# ReXGlue codegen manifest for Tony Hawk's Project 8 (Xbox 360).
#
# THIS CONFIGURATION REACHES IN-GAME: title screen, menus, FMV playback,
# real-time 3D rendering and audio, with saves written to XDG data.
# Verified 2026-07-30 against rexglue-sdk 0.8.0 prebuilt, clang 22.1.6, RTX 3060.
#
# Substitute your own dump path for REPLACE_ME. The image and the extracted
# disc are the owner's own material and live in ignored paths.
#
# Run it with:
#   LD_LIBRARY_PATH=<sdk>/lib ./thps_p8 --game_data_root=<extracted disc> \
#     --mnk_mode=true --log_file=run.log --log_level=info
# --mnk_mode=true is REQUIRED: keyboard input is registered but disabled by
# default, so without it every key silently does nothing. START is Escape.
#
# TRAP: [functions] MUST be nested as [entrypoint.functions]. A top-level
# table is parsed as a sibling of [project] and SILENTLY IGNORED - codegen
# then emits byte-identical UnresolvedCall errors, which reads like the
# addresses being wrong rather than the TOML being misplaced.

[project]
name = "thps_p8"
sdk_version = "0.8.0"
game_root = "REPLACE_ME/sources/install-media/derived/disc"

[entrypoint]
file_path = "REPLACE_ME/sources/install-media/derived/disc/default.xex"
out_directory_path = "../generated/default"  # relative to THIS file; ../generated is gitignored
includes = []

# Register-localization codegen flags. In-game profiling (2026-07-30) showed
# gameplay is bound by a single guest thread at 99% of one host core while all
# GPU/audio threads idle near 10%, so keeping guest registers in C++ locals
# instead of the guest context struct is the highest-leverage speedup lead.
#
# ALL CURRENTLY OFF. First attempt (2026-07-30) enabled ctr_as_local,
# xer_as_local, cr_as_local, reserved_as_local and non_argument_as_local
# together and the build died with SIGBUS ~14 s after launch, right after
# pipeline-cache warmup. Bisect one flag at a time before re-enabling any.
# skip_lr, skip_msr and non_volatile_as_local are additionally gated on the
# setjmp/longjmp question: longjmp restores non-volatile registers from the
# jmp_buf, and localizing them desynchronizes that path. setjmp is
# corroborated at 0x82630550; the longjmp lead (0x826307A0) is unverified -
# see facts/upstream-p8-config-claims.md.
#ctr_as_local = true
#xer_as_local = true
#cr_as_local = true
#reserved_as_local = true
#non_argument_as_local = true


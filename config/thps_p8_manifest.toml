# Parent-extent assertions (2026-07-31). 126 of the original 178 forced
# entries were MID-FUNCTION addresses per the image's own .pdata unwind
# table (exception scope-table / continuation pointers found by the batch
# data scan). Forcing them split ~70 parent functions, turning internal
# branches into cross-function jumps - survivable with context-struct
# registers, fatal under register localization (disproved.md D14). Assert
# the pdata extents instead so every such block stays internal. If any of
# these addresses is ever truly entered indirectly at runtime, the runtime
# FATAL will name it - re-add that one specifically.

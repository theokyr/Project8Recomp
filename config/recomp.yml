    Counted 4-byte-aligned within each code section. .text: 685 mtctr r0, 1235
    bctr. BINK: 5 mtctr r0, 7 bctr. Combined: 690 and 1242. Jump-table recovery
    keys off exactly that pair, so these counts bound the analysis workload.
    Any restated instruction count must name its section set and state that it
    was taken on 4-byte boundaries, or it is not comparable - a raw byte search
    over the whole image inflates the nop count 7.5x.
  unwind_census: >-
    19167 entries; 19072 begin in .text, 95 in BINK, 0 outside a code section.
    39 carry ExceptionFlag, of which 3 are the save/restore chain special
    encoding, leaving 36 real handlers. Coverage 6091544 of 6541956 bytes =
    93.115% of the combined code span. Full breakdown in facts/pdata-census.md.

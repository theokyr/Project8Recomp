name: Windows report
description: You ran the Windows build. Tell us what happened — working or not.
title: "[Windows] "
labels: [windows, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        The current complete build has not been maintainer-verified on real
        Windows hardware. A report that it worked is as useful to us as a
        crash, so please file either way.

        **Do not attach game files, disc images, or `default.xex`.**

  - type: dropdown
    id: outcome
    attributes:
      label: What happened
      options:
        - It worked
        - The launcher opened but something was wrong
        - The launcher would not start
        - Setup failed (disc check or copying)
        - It handed off to the game and the game failed
        - The game ran but performance or frame pacing was wrong
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Project8Recomp version
      placeholder: "e.g. v0.2.1"
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows version
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: CPU and GPU
      placeholder: "e.g. Ryzen 5 5600X, Radeon RX 6700 XT"

  - type: input
    id: performance
    attributes:
      label: Performance, if the game started
      description: Approximate fps and total CPU use from Task Manager are enough.
      placeholder: "e.g. 60 fps, 35% total CPU"

  - type: textarea
    id: what
    attributes:
      label: Details
      description: What you did, what you expected, what happened instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output and logs
      description: >
        Console output, and anything in the `logs/` folder of your install.
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: This report contains no game files, disc images, or game assets.
          required: true

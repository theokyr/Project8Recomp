# Builds and tests the launcher on every supported host toolchain.
#
# CI cannot build the game: generating its source reads default.xex out of a
# disc image, and no dump exists here. Game builds are cut on a machine that has
# one and attached to the release by hand. The launcher links no part of the
# SDK, so it builds anywhere.
#
# Windows is published as experimental: hosted CI proves it builds, while the
# complete release candidate is separately exercised under Proton before tag.

name: Launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04 }
          - { name: macos-arm64,    os: macos-14 }
          - { name: windows-x86_64, os: windows-2022 }

    steps:
      - uses: actions/checkout@v6

      - name: Check publishable tree and SDK patch inventory
        if: runner.os == 'Linux'
        run: |
          tools/check_no_game_content.sh
          tools/check_patch_series.sh

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake libfreetype-dev shellcheck xvfb \
            libx11-dev libxext-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev
          ./tools/ci/build_sdl3.sh

      - name: Check release tools
        if: runner.os == 'Linux'
        run: |
          shellcheck tools/*.sh tools/ci/*.sh tools/cross/*.sh
          python3 -m py_compile tools/*.py

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake sdl3 sdl3_image freetype

      # Windows deliberately avoids Git Bash and Ninja. Bash rewrites PATH into
      # Unix form, which CMake - a native Windows program - cannot parse, so it
      # finds neither the compiler nor Ninja even with the MSVC environment
      # loaded. PowerShell, vcpkg and the default Visual Studio generator sidestep
      # all of it.
      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # freetype is not optional: RmlUi's font engine hard-errors without
          # it. Verified by cross-building the same dependency set locally.
          vcpkg install sdl3 sdl3-image freetype --triplet x64-windows

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S src/launcher -B build/launcher -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DTHPS_P8_GUI_ISOLATED_SDL=OFF `
            -DTHPS_P8_GUI_EMBED_SOURCE_ASSET_PATH=OFF

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build/launcher --config Release --parallel 4

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir build/launcher -C Release --output-on-failure

      # The embedded source-assets path is a developer fallback and an absolute
      # path compiled into the binary; a shipped launcher has assets beside it
      # and never consults it.
      - name: Configure
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S src/launcher -B build/launcher -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHPS_P8_GUI_EMBED_SOURCE_ASSET_PATH=OFF

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build/launcher --parallel 4

      - name: Test
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build/launcher --output-on-failure

      # Parses every RML/RCSS document and fails on any diagnostic. It cannot
      # prove a control can be activated: no window manager, so synthetic input
      # never lands.
      - name: Check UI documents
        if: runner.os == 'Linux'
        run: |
          THPS_P8_GUI_STRICT=1 THPS_P8_GUI_EXIT_AFTER_LOAD=1 \
            xvfb-run -a ./build/launcher/thps_p8_gui

      # Both the launcher and the MSVC-ABI game use /MD. Proton and developer
      # machines commonly already provide this runtime, which made an archive
      # missing it look healthy; a clean Windows install then failed before
      # our own entry point could show an error. Ship Visual Studio's app-local
      # redistributable DLLs beside the executables.
      - name: Stage Visual C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products '*' -property installationPath
          if (-not $install) { throw 'Visual Studio installation not found' }
          # VS also places aliases such as "v143" in this directory. They are
          # not version strings and must not participate in numeric ordering.
          $versions = Get-ChildItem (Join-Path $install 'VC\Redist\MSVC') -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending
          if (-not $versions) { throw 'No numeric Visual C++ redist versions found' }
          $crt = $versions |
            ForEach-Object { Join-Path $_.FullName 'x64\Microsoft.VC143.CRT' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $crt) { throw 'Visual C++ x64 app-local runtime not found' }
          Copy-Item (Join-Path $crt '*.dll') build/launcher/Release/

      - name: Stage artifact
        shell: bash
        run: |
          set -eu
          out="dist/thps_p8_launcher-${{ matrix.name }}"
          mkdir -p "$out"
          # Named exactly, not globbed. `thps_p8_gui*` also matches the Visual
          # Studio generator's thps_p8_gui.sln and .vcxproj, and the first
          # Windows artifact shipped six MSBuild project files.
          #
          # Single-config generators put the binary in build/launcher; the
          # Visual Studio generator puts it in build/launcher/Release.
          for exe in Project8Recomp thps_p8_gui thps_p8_gui_settings_test; do
            cp "build/launcher/$exe" "$out/" 2>/dev/null || \
            cp "build/launcher/$exe.exe" "$out/" 2>/dev/null || \
            cp "build/launcher/Release/$exe.exe" "$out/" 2>/dev/null || true
          done
          cp -r src/launcher/assets "$out/"
          cp LICENSE NOTICE "$out/"
          # SDL3 is shared and is not a system library on any of these runners,
          # so it travels with the binary. vcpkg already stages its DLLs beside
          # the executable; the source-built prefix does not.
          cp build/launcher/Release/*.dll "$out/" 2>/dev/null || true
          if [ -d .sdl3-prefix ]; then
            cp .sdl3-prefix/bin/*.dll "$out/" 2>/dev/null || true
            cp .sdl3-prefix/lib/*.so* "$out/" 2>/dev/null || true
          fi
          # Homebrew links by absolute path, so the macOS binary would otherwise
          # run only on a machine with the same Homebrew SDL3 installed.
          if [ "${{ runner.os }}" = "macOS" ]; then
            chmod +x tools/ci/bundle_macos.sh
            ./tools/ci/bundle_macos.sh "$out" \
              "$out/thps_p8_gui" "$out/Project8Recomp"
          fi
          ls -la "$out"
          test -f "$out/thps_p8_gui" || test -f "$out/thps_p8_gui.exe"
          test -f "$out/Project8Recomp" || test -f "$out/Project8Recomp.exe"
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f "$out/msvcp140.dll"
            test -f "$out/msvcp140_atomic_wait.dll"
            test -f "$out/vcruntime140.dll"
            test -f "$out/vcruntime140_1.dll"
          fi
          # The first Windows artifact shipped .sln and .vcxproj files.
          ! ls "$out"/*.vcxproj "$out"/*.sln 2>/dev/null | grep -q .

      - uses: actions/upload-artifact@v7
        with:
          name: thps_p8_launcher-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
